name: Deploy

on:
  push:
    branches: [ main, staging ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Determine Auth URL
        id: auth-url
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "URL=${{ secrets.PROD_AUTH_URL }}" >> $GITHUB_ENV
          else
            echo "URL=${{ secrets.STAGING_AUTH_URL }}" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_BETTER_AUTH_URL=${{ env.URL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.yml"
          target: "~/villahvitfelt"

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/villahvitfelt
            
            # Lowercase repo name for Docker registry
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            # Determine env and image tag based on branch
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              export ENV_FILE=".env.prod"
              export IMAGE_TAG="main"
              export COMPOSE_PROJECT_NAME="villahvitfelt-prod"
            else
              export ENV_FILE=".env.staging"
              export IMAGE_TAG="staging"
              export COMPOSE_PROJECT_NAME="villahvitfelt-staging"
            fi
            
            export FULL_IMAGE_NAME="ghcr.io/$REPO_LOWER:$IMAGE_TAG"
            
            # Log in to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull, Migrate and Restart using the injected image name
            DOCKER_IMAGE=$FULL_IMAGE_NAME docker compose -p $COMPOSE_PROJECT_NAME --env-file $ENV_FILE pull
            DOCKER_IMAGE=$FULL_IMAGE_NAME docker compose -p $COMPOSE_PROJECT_NAME --env-file $ENV_FILE run --rm app node scripts/migrate.mjs
            DOCKER_IMAGE=$FULL_IMAGE_NAME docker compose -p $COMPOSE_PROJECT_NAME --env-file $ENV_FILE up -d --remove-orphans

  sync-branches:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge main into staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout staging
          git merge origin/main
          git push origin staging
