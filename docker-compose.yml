services:
  db:
    image: postgres:15-alpine
    container_name: ${ENV_PREFIX}-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-villahvitfelt}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./volumes/${ENV_PREFIX}/db:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}-app
    restart: always
    environment:
      DATABASE_URL: postgres://node:node@db:5432/${DB_NAME:-villahvitfelt}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      ENV_PREFIX: ${ENV_PREFIX}
    ports:
      - "${APP_PORT}:3000"
    depends_on:
      - db
    volumes:
      - ./volumes/${ENV_PREFIX}/uploads:/app/public/uploads

networks:
  default:
    name: ${ENV_PREFIX}-network
